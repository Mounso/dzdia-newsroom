# Services: ADR-004. Image, profiles, migrations and secrets: ADR-006.
#   dev:  docker compose --profile dev up -d --build    (+ cloudflared tunnel to the API)
#   prod: deploy/deploy.sh <ref> on the VM (ADR-0007), which builds and runs the `prod` profile
#         (+ caddy on ports 80 and 443)
# `.env` is only used for interpolation: each service lists the variables it receives, so the
# API never gets the bot token (ADR-005).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  build: .
  image: dzdia-newsroom:local
  restart: unless-stopped
  logging: *logging

x-database-url: &database-url "postgresql://dzdia:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/dzdia"

services:
  postgres:
    # Pinned to the PostgreSQL major (pg16) and the Debian release: a major upgrade needs a dump and
    # restore, and a new glibc can change collations. tests/test_supply_chain.py enforces both.
    image: pgvector/pgvector:0.8.7-pg16-bookworm@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    restart: unless-stopped
    environment:
      POSTGRES_USER: dzdia
      POSTGRES_DB: dzdia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"  # loopback only, also in prod (ADR-006)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dzdia -d dzdia"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  migrate:
    <<: *app
    restart: "no"
    command: ["python", "-m", "dzdia_newsroom.db.migrate"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    environment:
      DATABASE_URL: *database-url
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?set TELEGRAM_WEBHOOK_SECRET in .env}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      TELEGRAM_TEAM_CHAT_ID: ${TELEGRAM_TEAM_CHAT_ID:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      # No curl in the slim image: Python does the probe.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["python", "-m", "dzdia_newsroom.worker"]
    environment:
      DATABASE_URL: *database-url
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    stop_grace_period: 30s  # the worker itself gives the current job 25 s (ADR-005)
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One-off Bot API commands; the only service that gets both the token and the webhook secret:
  #   docker compose run --rm telegram-cli set-webhook --url https://<host>/webhooks/telegram
  telegram-cli:
    <<: *app
    profiles: ["tools"]
    restart: "no"
    entrypoint: ["python", "-m", "dzdia_newsroom.channels.telegram"]
    command: ["--help"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?set TELEGRAM_WEBHOOK_SECRET in .env}

  # Dev only: a public HTTPS URL for the webhook, without an account. The URL changes on every
  # start: read it with `docker compose logs cloudflared`, then run `set-webhook` again.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.5@sha256:1b1d34d0a9c0bfca9de72db8460d328db3f19edd2b96169114e3e893a97bbe53
    profiles: ["dev"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://api:8000"]
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  # Prod only: the single public entry point, with automatic Let's Encrypt certificates.
  caddy:
    image: caddy:2.11.7@sha256:5e5286cb37d44086d651a5363f05f43a692ce4d649d88fb1bd844579f45fa9e8
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  # Ops only (ADR-0007): deploy/backup.sh streams encrypted dumps to Oracle Object Storage through
  # it. The VM authenticates as an instance principal, so no credential is stored anywhere; its
  # policy only lets it add objects to the bucket.
  rclone:
    image: rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
    profiles: ["ops"]
    restart: "no"
    environment:
      RCLONE_CONFIG_OOS_TYPE: oracleobjectstorage
      RCLONE_CONFIG_OOS_PROVIDER: instance_principal_auth
      RCLONE_CONFIG_OOS_NAMESPACE: ${OCI_NAMESPACE:-}
      RCLONE_CONFIG_OOS_COMPARTMENT: ${OCI_COMPARTMENT_OCID:-}
      RCLONE_CONFIG_OOS_REGION: ${OCI_REGION:-}
      RCLONE_OOS_NO_CHECK_BUCKET: "true"  # the policy does not allow creating buckets
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
