[project]
name = "dzdia-newsroom"
version = "0.1.0"
description = "AI newsroom assistant for the dzdia.com editorial team"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "feedparser>=6.0",
    "google-genai>=1.0",
    "httpx>=0.27",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "rapidfuzz>=3.9",
    "trafilatura>=1.12",
    "uvicorn>=0.30",
]

[dependency-groups]
audit = [
    "pip-audit>=2.10.1",
]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dzdia_newsroom"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/dzdia_newsroom", "evals"]
branch = true

[tool.coverage.report]
# Ratchet: one point under the total measured with Postgres (69 % on 2026-10-28). Raise it as
# coverage grows, never lower it to make a change pass.
fail_under = 68
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # French typography (’, «, ») is intentional

[tool.mypy]
strict = true
files = ["src", "evals", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["feedparser.*", "trafilatura.*"]
ignore_missing_imports = true
