name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dzdia
          POSTGRES_PASSWORD: dzdia  # throwaway CI container, not a real secret
          POSTGRES_DB: dzdia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dzdia"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://dzdia:dzdia@localhost:5432/dzdia_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
